<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analyse partagée - MargeShark</title>
<meta name="description" content="Résultat d'une analyse MargeShark partagée par un utilisateur." />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ocean-deep: #050d1a;
    --teal: #2dd4bf;
    --text-hi: #eaf3f7;
    --text-dim: #768e9f;
    --line: rgba(148, 180, 200, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    background: var(--ocean-deep);
    color: var(--text-hi);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .topbar img { width: 30px; height: 30px; }
  .topbar .brand { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 17px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  .shared-note {
    background: rgba(45, 212, 191, 0.08); border: 1px solid rgba(45, 212, 191, 0.25);
    border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--text-dim);
    margin-bottom: 20px; text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
  }
  .ad-context-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-dim); margin-bottom: 3px; }
  .ad-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .ad-original-link { margin-bottom: 16px; }
  .ad-original-link a { font-size: 12.5px; color: var(--teal); text-decoration: none; border-bottom: 1px dashed rgba(45,212,191,0.4); }
  .disclaimer-share { font-size: 10.5px; color: var(--text-dim); margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); line-height: 1.5; }
  .score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .score-circle {
    width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 20px; flex-shrink: 0; border: 3px solid;
  }
  .score-green { color: #4ade80; border-color: #4ade80; background: rgba(74,222,128,0.08); }
  .score-orange { color: #fbbf24; border-color: #fbbf24; background: rgba(251,191,36,0.08); }
  .score-red { color: #f87171; border-color: #f87171; background: rgba(248,113,113,0.08); }
  .verdict { font-size: 16px; font-weight: 700; }
  .confidence { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin: 16px 0 8px; }
  .section-title:first-child { margin-top: 0; }
  ul.points-list { list-style: none; }
  ul.points-list li { font-size: 13px; padding: 4px 0 4px 20px; position: relative; }
  ul.points-list li::before { position: absolute; left: 0; }
  .points-good li::before { content: "✅"; }
  .points-warn li::before { content: "🔎"; }
  .points-danger li::before { content: "⚠️"; }
  .nego-box { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-top: 6px; }

  /* Modale promotionnelle - apparaît une fois l'analyse affichée */
  .promo-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(3px); z-index: 50; align-items: flex-end; justify-content: center;
  }
  .promo-modal-overlay.open { display: flex; }
  .promo-modal-box {
    width: 100%; max-width: 480px; background: #0f172a; border: 1px solid var(--line);
    border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 24px 20px 28px;
    text-align: center; animation: promoSlideUp 0.3s ease-out;
  }
  @keyframes promoSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .promo-modal-close { position: absolute; top: -34px; right: 14px; background: rgba(15,23,42,0.9); border: 1px solid var(--line); color: var(--text-hi); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .promo-modal-box h2 { font-family: "Space Grotesk", sans-serif; font-size: 18px; margin-bottom: 8px; }
  .promo-modal-box p { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }
  .cta-btn {
    display: inline-block; background: #facc15; color: #000; font-weight: 800;
    padding: 12px 24px; border-radius: 10px; text-decoration: none; font-size: 14px;
  }
  .promo-modal-box .cta-btn { width: 100%; box-sizing: border-box; }

  .loading, .error-box { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 13.5px; }
  .error-box { color: #f87171; }
</style>
</head>
<body>

<div class="topbar">
  <img src="icon-pwa-192.png" alt="MargeShark" />
  <span class="brand">MargeShark</span>
</div>

<div class="wrap">
  <div class="shared-note">🔗 Analyse partagée depuis MargeShark</div>
  <div id="content">
    <div class="loading">Chargement de l'analyse...</div>
  </div>
</div>

<div class="promo-modal-overlay" id="promoModalOverlay">
  <div class="promo-modal-box" style="position:relative;">
    <button class="promo-modal-close" id="promoModalClose">✕</button>
    <h2>🦈 Toi aussi, analyse tes annonces</h2>
    <p>MargeShark détecte les bonnes affaires (et les arnaques) sur Leboncoin en quelques secondes, gratuitement, sans carte bancaire.</p>
    <a href="https://margeshark.fr" target="_blank" rel="noopener" class="cta-btn">Essayer MargeShark →</a>
  </div>
</div>

<script>
  const MARGESHARK_BACKEND_URL = "https://margeshark-production.up.railway.app";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function getScoreClass(score) {
    if (score >= 8) return "score-green";
    if (score >= 5) return "score-orange";
    return "score-red";
  }

  function renderPointsList(title, items, className) {
    if (!items || items.length === 0) return "";
    return `
      <div class="section-title">${title}</div>
      <ul class="points-list ${className}">
        ${items.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}
      </ul>
    `;
  }

  async function loadSharedAnalysis() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const contentEl = document.getElementById("content");

    if (!id) {
      contentEl.innerHTML = `<div class="error-box">Lien de partage invalide - identifiant manquant.</div>`;
      return;
    }

    try {
      const response = await fetch(`${MARGESHARK_BACKEND_URL}/api/share/${encodeURIComponent(id)}`);
      if (!response.ok) {
        contentEl.innerHTML = `<div class="error-box">Ce lien de partage n'existe pas ou a expiré.</div>`;
        return;
      }

      const data = await response.json();
      const a = data.analysis || {};
      const score = a.score || 0;
      const scoreClass = getScoreClass(score);
      const confidence = a.niveau_confiance || "Moyenne";

      contentEl.innerHTML = `
        <div class="card">
          ${data.category ? `<div class="ad-context-label">Catégorie</div><div class="ad-title">🏷️ ${escapeHtml(data.category)}</div>` : ""}
          ${data.url ? `<div class="ad-original-link"><a href="${escapeHtml(data.url)}" target="_blank" rel="noopener">Voir l'annonce originale sur Leboncoin ↗</a></div>` : ""}

          <div class="score-row">
            <div class="score-circle ${scoreClass}">${escapeHtml(String(score))}<span style="font-size:11px;">/10</span></div>
            <div>
              <div class="verdict">${escapeHtml(a.verdict || "-")}</div>
              <div class="confidence">🔍 Confiance de l'estimation : ${escapeHtml(confidence)}</div>
            </div>
          </div>

          ${a.avis_general_produit ? `<div class="section-title">Avis général</div><p style="font-size:13px;">${escapeHtml(a.avis_general_produit)}</p>` : ""}

          ${renderPointsList("✅ Points forts", a.points_forts, "points-good")}
          ${renderPointsList("🔎 Points d'attention", a.points_attention, "points-warn")}
          ${renderPointsList("⚠️ Red flags détectés", a.red_flags, "points-danger")}
          ${renderPointsList("❓ Questions au vendeur", a.questions_au_vendeur, "points-warn")}
          ${renderPointsList("🧪 À vérifier sur place", a.points_a_verifier_sur_place, "points-warn")}

          ${a.messages_negociation && a.messages_negociation.doux ? `
            <div class="section-title">💬 Message de négociation suggéré</div>
            <div class="nego-box">${escapeHtml(a.messages_negociation.doux)}</div>
          ` : ""}

          <p class="disclaimer-share">Cette page présente une analyse indépendante générée par l'intelligence artificielle de MargeShark, non affiliée à Leboncoin. Le prix, la description complète et les photos de l'annonce restent uniquement consultables sur Leboncoin.fr via le lien ci-dessus.</p>
        </div>
      `;

      openPromoModal();
    } catch (error) {
      contentEl.innerHTML = `<div class="error-box">Impossible de charger cette analyse pour le moment. Réessaie dans quelques instants.</div>`;
    }
  }

  // Modale promotionnelle - apparaît une fois l'analyse affichée, avec un
  // court délai pour laisser la personne lire le résultat d'abord plutôt
  // que de lui bloquer la vue immédiatement.
  function openPromoModal() {
    setTimeout(() => {
      document.getElementById("promoModalOverlay").classList.add("open");
    }, 2500);
  }

  document.getElementById("promoModalClose").addEventListener("click", () => {
    document.getElementById("promoModalOverlay").classList.remove("open");
  });
  document.getElementById("promoModalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "promoModalOverlay") {
      document.getElementById("promoModalOverlay").classList.remove("open");
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.getElementById("promoModalOverlay").classList.remove("open");
    }
  });

  loadSharedAnalysis();
</script>

</body>
</html>
